name: Backend CI

on:
  push:
    branches:
      - main
      - codex/config-baseline
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1/news_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run citation-grounding fixtures
        run: python scripts/evaluate_faithfulness.py

      - name: Compile Python sources
        run: python -m compileall -q toutiao_backend tests scripts

      - name: Validate OpenAPI generation
        run: >-
          python -c "import sys; sys.path.insert(0, 'toutiao_backend');
          from main import app; schema = app.openapi(); assert schema['paths'];
          print('OpenAPI paths:', len(schema['paths']))"

      - name: Check dependency integrity
        run: python -m pip check
