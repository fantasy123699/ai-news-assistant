services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://news_app:${MYSQL_PASSWORD:-news-app-dev}@db:3306/news_app?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-deepseek-r1:1.5b}
      LOCAL_LLM_BASE_URL: ${CONTAINER_LLM_BASE_URL:-http://host.docker.internal:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: news_app
      MYSQL_USER: news_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-news-app-dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
